
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Song ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: radial-gradient(circle at center, #103d59, #061629 65%, #020915);
  color: #dffaff;
  font-family: Vazirmatn, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white, transparent),
    radial-gradient(2px 2px at 70% 20%, #67eaff, transparent),
    radial-gradient(2px 2px at 40% 80%, white, transparent),
    radial-gradient(2px 2px at 85% 65%, #67eaff, transparent);
  background-size: 250px 250px;
  animation: glow 4s infinite alternate;
}

@keyframes glow {
  from { opacity: .3; }
  to { opacity: 1; }
}

.player {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 390px;
  padding: 30px 24px;
  text-align: center;
  border: 1px solid #1688a8;
  border-radius: 25px;
  background: #09243be8;
  box-shadow: 0 0 45px #13c7e522;
}

.art {
  width: 210px;
  height: 210px;
  margin: 0 auto 25px;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 85px;
  background:
    radial-gradient(circle, #1cabc8, #075071 45%, #061629);
  box-shadow: 0 0 35px #20c9e855;
}

h1 {
  color: #a5f4ff;
  font-size: 27px;
  margin-bottom: 5px;
}

.artist {
  color: #a8dce8;
  font-size: 14px;
}

.quote {
  color: #a5f4ff;
  line-height: 2;
  font-size: 14px;
  margin: 25px 0;
}

audio {
  width: 100%;
  height: 42px;
  accent-color: #20c9e8;
}

.note {
  color: #82b8c9;
  font-size: 11px;
  margin-top: 20px;
}

</style>
</head>

<body>

<div class="stars"></div>

<main class="player">

  <div class="art">🌙</div>

  <h1>ماندگار</h1>
  <p class="artist">شادمهر عقیلی</p>

  <p class="quote">
    «بعضی آهنگ‌ها برای شنیده شدن نیستن،
    برای خاطره ساختنن...»
  </p>

  <audio controls preload="auto">
  <source src="./music/mandegar.mp3" type="audio/mpeg">
  مرورگر شما از پخش صوت پشتیبانی نمی‌کند.
</audio>

  <p class="note">
    MADE WITH LOVE BY MOEIN ♡
  </p>

</main>

</body>
</html>
